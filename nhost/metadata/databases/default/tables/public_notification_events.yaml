table:
  name: notification_events
  schema: public
event_triggers:
  - name: notification_events_insert_trigger
    definition:
      enable_manual: false
      insert:
        columns: '*'
    webhook: '{{NHOST_FUNCTIONS_URL}}/deliverNotification'
    headers:
      - name: x-hasura-admin-secret
        value_from_env: ACTION_SECRET
    retry_conf:
      num_retries: 3
      interval_sec: 10
      timeout_sec: 30
