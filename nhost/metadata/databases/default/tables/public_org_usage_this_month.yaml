table:
  name: org_usage_this_month
  schema: public
object_relationships:
  - name: organization
    using:
      manual_configuration:
        remote_table:
          name: organizations
          schema: public
        column_mapping:
          org_id: id
select_permissions:
  - role: user
    permission:
      columns:
        [org_id, quota_calls_allowed, quota_calls_used, runs_this_month,
         avg_run_duration_seconds]
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
