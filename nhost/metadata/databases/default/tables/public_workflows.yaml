table:
  name: workflows
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: workflow_steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: workflow_triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
select_permissions:
  - role: user
    permission:
      columns: [id, org_id, name, description, is_active, created_by, created_at, updated_at]
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      # Layer 1: any member (owner/editor/viewer) of the workflow's org can
      # see it. This is what "the query returning an org's workflows" relies
      # on — and it's the same filter that keeps Org B from ever seeing an
      # Org A workflow, even by ID, since a direct `workflow(id: ...)` query
      # still passes through this row filter.
insert_permissions:
  - role: user
    permission:
      check:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in: [owner, editor]
      columns: [org_id, name, description, is_active, created_by]
      set:
        created_by: X-Hasura-User-Id
      # Layer 1: owner or editor can create a workflow in an org they belong
      # to. Viewers are excluded ("read-only, cannot trigger a run" — and by
      # extension cannot author workflows either).
update_permissions:
  - role: user
    permission:
      columns: [name, description, is_active]
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in: [owner, editor]
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
